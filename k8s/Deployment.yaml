apiVersion: apps/v1
kind: Deployment

metadata:
  name: kubernetes-cicd-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: kubernetes-cicd-app

  template:
    metadata:
      labels:
        app: kubernetes-cicd-app

    spec:
      containers:
        - name: kubernetes-cicd-container
          image: YOUR_DOCKERHUB_USERNAME/kubernetes-cicd-app:latest

          ports:
            - containerPort: 80
